[project]
name = "monitor"
version = "0.1.0"
description = "DSA platform moderation monitor: monthly totals from the Transparency Database"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.0", "requests>=2.31"]

[project.scripts]
monitor = "monitor.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitor"]

[tool.ruff]
line-length = 100
